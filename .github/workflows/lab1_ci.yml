name: Lab1 CI

on:
  push:
    branches: [main]
    paths: ["Lab1/**", ".github/workflows/lab1_ci.yml"]
  pull_request:
    branches: [main]
    paths: ["Lab1/**", ".github/workflows/lab1_ci.yml"]
  workflow_dispatch:   # lets you run it manually from the Actions tab

defaults:
  run:
    working-directory: Lab1   # Lab1 is a subfolder of the repo

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Lab1/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check src test

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Lab1/requirements.txt
      - run: pip install -r requirements.txt

      - name: Run pytest with coverage (fails below 90%)
        run: >
          pytest --junitxml=pytest-report.xml
          --cov=src --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90

      - name: Run unittest
        run: python -m unittest test.test_unittest -v

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            Lab1/pytest-report.xml
            Lab1/coverage.xml

      - name: Notify on success
        if: success()
        run: echo "All tests passed on Python ${{ matrix.python-version }}"

      - name: Notify on failure
        if: failure()
        run: echo "Tests failed on Python ${{ matrix.python-version }}"
